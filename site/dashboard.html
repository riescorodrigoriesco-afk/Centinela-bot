<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centinela · Configurar</title>
<style>
:root{--night:#0b1626;--deep:#101f35;--line:#22344f;--fog:#c9d4e3;--mute:#8ea0b8;--ok:#3fd0b0;--bad:#ff5a4e;--white:#f4f7fb}
*{box-sizing:border-box;margin:0}
body{background:var(--night);color:var(--fog);font:16px/1.5 system-ui,sans-serif}
a{color:var(--ok)}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:var(--deep);border-right:1px solid var(--line);padding:16px;overflow:auto;max-height:100vh;position:sticky;top:0}
aside h2{font-size:.8rem;color:var(--mute);font-weight:600;margin:16px 0 6px}
aside button.item{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--fog);padding:8px 10px;border-radius:8px;cursor:pointer;font:inherit}
aside button.item:hover{background:#16294a}
aside button.item[aria-current=true]{background:#1b3358;color:var(--white)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);margin-top:8px;flex:none}.dot.on{background:var(--ok)}
select.srv{width:100%;background:var(--night);color:var(--white);border:1px solid var(--line);padding:10px;border-radius:8px;font:inherit}
main{padding:28px;max-width:980px;width:100%}
h1{color:var(--white);font-size:1.6rem;margin-bottom:4px}
.sub{color:var(--mute);margin-bottom:22px}
.card{background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h3{color:var(--white);font-size:1rem;margin-bottom:12px}
label{display:block;font-size:.9rem;margin:10px 0 4px;color:var(--fog)}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--night);color:var(--white);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit}
textarea{min-height:90px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--ok);color:#06241d;border:0;border-radius:8px;padding:10px 16px;font:600 .95rem system-ui;cursor:pointer}
.btn.sec{background:transparent;color:var(--white);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.check{display:flex;gap:10px;align-items:center;padding:6px 0}
.check input{width:18px;height:18px;accent-color:var(--ok)}
.toast{position:fixed;bottom:18px;right:18px;background:var(--white);color:#0b1626;padding:12px 16px;border-radius:10px;max-width:340px;box-shadow:0 8px 30px #0008}
.err{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
button.modcard{text-align:left;cursor:pointer;color:inherit;font:inherit;margin:0}
button.modcard:hover,.srvcard:hover{border-color:var(--ok)}
.srvcard .btn{display:inline-block;text-decoration:none;margin-top:6px}
pre{white-space:pre-wrap;background:var(--night);padding:12px;border-radius:8px;border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.list{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0}
.scroll{max-height:55vh;overflow:auto}
.li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--deep);margin:0;cursor:pointer}
.li:last-child{border-bottom:0}
.li.off{opacity:.5;cursor:not-allowed}
.li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.li input[type=checkbox]{width:18px;height:18px;accent-color:var(--bad);flex:none}
.sw{width:12px;height:12px;border-radius:50%;flex:none}
.chip{display:inline-flex;align-items:center;gap:2px;background:#16294a;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:.82rem;margin:2px 4px 2px 0}
.chip button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:1rem;line-height:1;padding:0 6px}
.chip button:hover{color:var(--bad)}
.av{width:40px;height:40px;border-radius:50%;background:var(--line);flex:none;object-fit:cover}
.mini{padding:6px 12px;font-size:.85rem}
.tag{font-size:.7rem;background:var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:static;max-height:none}main{padding:18px}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div id="who"></div>
    <p><a href="#" id="back">← Todos mis servidores</a></p>
    <h2>Servidor</h2>
    <select class="srv" id="srv" aria-label="Servidor"></select>
    <h2>Módulos</h2>
    <div id="nav"></div>
  </aside>
  <main id="main"><p class="sub">Cargando…</p></main>
</div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var G=null,cur='home';
  function api(m,u,b){return fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Error');return j})})}
  function toast(t,bad){var e=$('#toast');e.textContent=t;e.className='toast'+(bad?' err':'');e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},3500)}
  function el(tag,attrs,kids){var e=document.createElement(tag);for(var k in (attrs||{})){if(k==='text')e.textContent=attrs[k];else if(k==='on')for(var ev in attrs.on)e.addEventListener(ev,attrs.on[ev]);else e.setAttribute(k,attrs[k])}(kids||[]).forEach(function(c){if(c)e.appendChild(c)});return e}

  function loginView(msg,oauth){
    var m=$('#main');m.innerHTML='';$('#who').innerHTML='';
    var c=el('div',{class:'card'});
    c.appendChild(el('h3',{text:'Bienvenido a Centinela'}));
    c.appendChild(el('p',{class:'sub',text:msg||'Entra con Discord, autoriza la app, añade a Centinela a tu servidor y personalízalo todo desde aquí.'}));
    var row=el('div',{class:'row'});
    if(oauth)row.appendChild(el('a',{class:'btn',href:'/auth/login',text:'Login with Discord'}));
    c.appendChild(row);m.appendChild(c);
    var aside=document.querySelector('aside');aside.style.display='none';document.querySelector('.app').style.gridTemplateColumns='1fr';
    if(oauth&&!msg&&!new URLSearchParams(location.search).get('e')){c.appendChild(el('p',{class:'sub',text:'Abriendo Discord…'}));setTimeout(function(){location.replace('/auth/login')},400)}
  }
  var ERR={nosetup:'Primero conecta el token del bot en el panel.',denied:'Cancelaste la autorización. Pulsa de nuevo para continuar.',state:'La sesión caducó. Inténtalo otra vez.',token:'No se pudo iniciar sesión. Si Discord dice «redirect_uri inválido» u «OAuth2 inválido», añade '+location.origin+'/auth/callback en Developer Portal → OAuth2 → Redirects.'};
  function loadGuilds(){
    api('GET','/api/me').then(function(me){
      var e=new URLSearchParams(location.search).get('e');
      if(!me.loggedIn)return loginView(ERR[e],me.oauth);
      var w=$('#who');w.innerHTML='';
      w.appendChild(el('p',{class:'sub',text:me.name+(me.admin?' (administrador)':'')}));
      w.appendChild(el('a',{href:'/auth/logout',text:'Cerrar sesión'}));
      return api('GET','/api/guilds').then(function(r){pickerView(r)});
    }).catch(function(e){$('#main').textContent=e.message});
  }
  var pollT=null;
  function layout(sidebar){
    document.querySelector('aside').style.display=sidebar?'':'none';
    document.querySelector('.app').style.gridTemplateColumns=sidebar?'':'1fr';
  }
  function pickerView(r){
    clearInterval(pollT);layout(false);
    var m=$('#main');m.innerHTML='';
    var top=el('div',{class:'row',style:'justify-content:space-between;margin-bottom:18px'},[el('div',{},[el('h1',{text:'Tus servidores'}),el('p',{class:'sub',text:'Elige uno para configurarlo o añade a Centinela.'})]),el('div',{id:'who2'})]);
    m.appendChild(top);
    var known=r.guilds.map(function(g){return g.id});
    if(r.invite)m.appendChild(el('p',{},[el('a',{class:'btn',href:r.invite,target:'_blank',rel:'noopener',text:'➕ Añadir Centinela a un servidor',on:{click:function(){waitNew(known)}}})]));
    if(r.userInvite)m.appendChild(el('div',{class:'card',style:'margin-bottom:16px'},[el('h3',{text:'📲 Centinela como app externa (solo tú)'}),el('p',{class:'sub',style:'font-size:.9rem',text:'Instálalo en tu cuenta y podrás usar /enviarmensaje en CUALQUIER servidor o chat, aunque el bot no esté dentro. Ahí no puede escribir por MD a los miembros (Discord no lo permite): publica el mensaje en el canal donde lo uses. Dentro de tus servidores sigue mandando el MD a todos.'}),el('a',{class:'btn sec',href:r.userInvite,target:'_blank',rel:'noopener',text:'📲 Instalar en mi cuenta'})]));
    if(!r.online)m.appendChild(el('p',{class:'err',text:'El bot no está en línea ahora mismo.'}));
    var grid=el('div',{class:'grid'});
    r.guilds.forEach(function(g){
      grid.appendChild(el('div',{class:'card srvcard'},[el('h3',{text:g.name}),el('p',{class:'sub',text:g.members+' miembros · Centinela instalado'}),
        el('button',{class:'btn',text:'Configurar',on:{click:function(){openGuild(g.id,r.guilds)}}})]));
    });
    (r.available||[]).forEach(function(g){
      grid.appendChild(el('div',{class:'card srvcard'},[el('h3',{text:g.name}),el('p',{class:'sub',text:'Centinela todavía no está aquí'}),
        el('a',{class:'btn sec',href:g.invite,target:'_blank',rel:'noopener',text:'Añadir a Centinela',on:{click:function(){waitFor(g.id)}}})]));
    });
    if(!r.guilds.length&&!(r.available||[]).length)m.appendChild(el('p',{class:'sub',text:'No encontramos servidores donde tengas permiso de administrar. Crea uno o pide que te den el permiso «Gestionar servidor».'}));
    m.appendChild(grid);
    api('GET','/api/me').then(function(me){var w=$('#who2');if(!w)return;w.appendChild(el('span',{class:'sub',text:me.name+'  '}));w.appendChild(el('a',{href:'/auth/logout',text:'Cerrar sesión'}))});
  }
  function waitNew(known){
    var n=0;clearInterval(pollT);toast('Cuando termines de añadir el bot, aparecerá aquí.');
    pollT=setInterval(function(){
      if(++n>45){clearInterval(pollT);return}
      api('GET','/api/guilds').then(function(r){
        if(r.guilds.some(function(g){return known.indexOf(g.id)<0})){clearInterval(pollT);pickerView(r)}
      }).catch(function(){});
    },4000);
  }
  function waitFor(gid){
    var n=0;clearInterval(pollT);toast('Cuando termines de añadir el bot, te llevo a configurarlo.');
    pollT=setInterval(function(){
      if(++n>45){clearInterval(pollT);return}
      api('GET','/api/guilds').then(function(r){
        if(r.guilds.some(function(g){return g.id===gid})){clearInterval(pollT);openGuild(gid,r.guilds)}
      }).catch(function(){});
    },4000);
  }
  function openGuild(id,guilds){
    layout(true);
    var s=$('#srv');s.innerHTML='';
    guilds.forEach(function(g){var o=el('option',{value:g.id,text:g.name});if(g.id===id)o.selected=true;s.appendChild(o)});
    s.onchange=function(){load(s.value)};
    cur='home';load(id);
  }
  function list(l,online,avail){pickerView({guilds:l,online:online,available:avail})}
  function load(id){api('GET','/api/guild/'+id).then(function(g){G=g;nav();show(cur)}).catch(function(e){toast(e.message,1)})}
  function nav(){
    var n=$('#nav');n.innerHTML='';
    n.appendChild(item('home','🏠','Inicio e instalación',null));
    n.appendChild(item('tpl','🧩','Plantillas de servidor',null));
    n.appendChild(item('manage','🛠️','Gestionar servidor',null));
    G.mods.forEach(function(m){n.appendChild(item(m.id,m.ico,m.n,m.on))});
  }
  function item(id,ico,name,on){
    var b=el('button',{class:'item','aria-current':String(cur===id),on:{click:function(){cur=id;nav();show(id)}}},[
      on===null?el('span',{class:'dot',style:'opacity:.3'}):el('span',{class:'dot'+(on?' on':'')}),el('span',{text:ico+' '+name})]);
    return b;
  }
  function show(id){
    var m=$('#main');m.innerHTML='';
    if(id==='home')return home(m);
    if(id==='tpl')return tplView(m);
    if(id==='manage')return manageView(m);
    var mod=G.mods.find(function(x){return x.id===id});if(mod)modView(m,mod);
  }

  var tplPoll=null;
  function tplView(m){
    clearInterval(tplPoll);
    m.appendChild(el('h1',{text:'🧩 Plantillas de servidor'}));
    m.appendChild(el('p',{class:'sub',text:'Crea tu servidor, añade a Centinela y elige un tipo: se crean los roles, categorías y canales con sus permisos, y se dejan listos tickets, roles por botones, autoroles, bienvenidas, niveles y antiraid. Puedes repetirlo sin duplicar nada.'}));
    var opt=el('div',{class:'card'});
    var cl=el('input',{type:'checkbox'});var ar=el('input',{type:'checkbox',checked:'checked'});
    opt.appendChild(el('label',{class:'check'},[ar,el('span',{text:'Instalar antiraid y registros (recomendado)'})]));
    opt.appendChild(el('label',{class:'check'},[cl,el('span',{text:'Quitar los canales por defecto (#general, «Canales de texto»…) — solo si el servidor es nuevo'})]));
    m.appendChild(opt);
    var out=el('pre',{hidden:'hidden'});
    var find=el('input',{type:'text',placeholder:'🔎 Buscar plantilla: LaLiga, Premier, boxeo, NBA, gaming, anime…',style:'margin-bottom:14px'});
    var count=el('p',{class:'sub',style:'font-size:.85rem;margin:-6px 0 12px'});
    m.appendChild(find);m.appendChild(count);
    var grid=el('div',{class:'grid'});m.appendChild(grid);m.appendChild(out);
    var norm=function(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')};
    var cards=[];
    var filter=function(){
      var ws=norm(find.value).split(/\s+/).filter(Boolean),n=0;
      cards.forEach(function(c){var ok=ws.every(function(w){return c.hay.indexOf(w)>=0});c.node.style.display=ok?'':'none';if(ok)n++});
      count.textContent=n+' de '+cards.length+' plantillas';
    };
    find.addEventListener('input',filter);
    api('GET','/api/templates').then(function(r){
      r.templates.forEach(function(t){
        var b=el('button',{class:'btn',text:'Aplicar',on:{click:function(ev){
          if(!confirm('¿Aplicar la plantilla «'+t.name+'» en '+G.name+'? Se crearán '+t.roles+' roles y '+t.channels+' canales (no se borra nada tuyo).'))return;
          ev.target.disabled=true;out.hidden=false;out.textContent='Empezando…';
          api('POST','/api/guild/'+G.id+'/template',{id:t.id,clean:cl.checked,antiraid:ar.checked}).then(function(){
            tplPoll=setInterval(function(){
              api('GET','/api/guild/'+G.id+'/template/status').then(function(s){
                out.textContent=s.lines.join('\n');out.scrollTop=out.scrollHeight;
                if(!s.running){clearInterval(tplPoll);ev.target.disabled=false;toast(s.error?'Hubo un error':'Plantilla aplicada',!!s.error);load(G.id)}
              }).catch(function(){});
            },1500);
          }).catch(function(e){ev.target.disabled=false;out.textContent=e.message;toast(e.message,1)});
        }}});
        var node=el('div',{class:'card'},[el('h3',{text:t.ico+' '+t.name}),el('p',{class:'sub',style:'font-size:.9rem',text:t.desc}),el('p',{class:'sub',style:'font-size:.82rem',text:t.roles+' roles · '+t.channels+' canales'}),b]);
        cards.push({node:node,hay:norm(t.name+' '+t.id+' '+t.desc)});
        grid.appendChild(node);
      });
      filter();
    }).catch(function(e){toast(e.message,1)});
  }

  /* ===== Gestionar servidor: miembros, roles, canales y baneos ===== */
  var MG=null;
  function mapi(m,path,b){return api(m,'/api/guild/'+G.id+'/manage'+path,b)}
  function nrm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
  function hexOk(c){return /^#[0-9a-f]{6}$/i.test(c||'')?c:'#99aab5'}
  function overview(force){
    if(!force&&MG&&MG.id===G.id)return Promise.resolve(MG);
    return mapi('GET','/overview').then(function(o){MG=o;return o});
  }
  function act(path,body,ok,btn){
    if(btn)btn.disabled=true;
    return mapi('POST',path,body).then(function(r){toast(r.note||'Hecho');if(ok)ok(r)}).catch(function(e){toast(e.message,1)}).then(function(){if(btn)btn.disabled=false});
  }
  function manageView(m){
    MG=null;
    m.appendChild(el('h1',{text:'🛠️ Gestionar servidor'}));
    m.appendChild(el('p',{class:'sub',text:'Borra roles y canales, banea o desbanea y da roles sin abrir Discord. Funciona con tus permisos de Discord (no puedes hacer aquí nada que no puedas hacer allí) y todo queda anotado en el registro de moderación y en el registro de auditoría.'}));
    var bar=el('div',{class:'tabs'});var body=el('div');
    m.appendChild(bar);m.appendChild(body);
    var defs=[['mem','👥 Miembros',tabMembers],['rol','🏷️ Roles',tabRoles],['can','📁 Canales',tabChannels],['ban','🔨 Baneos',tabBans]];
    function go(k){
      bar.innerHTML='';body.innerHTML='';
      defs.forEach(function(d){bar.appendChild(el('button',{class:'btn'+(d[0]===k?'':' sec'),text:d[1],on:{click:function(){go(d[0])}}}))});
      defs.filter(function(d){return d[0]===k})[0][2](body);
    }
    go('mem');
  }

  /* Lista con casillas para borrar varios a la vez */
  function checklist(items,find,info,unit){
    var box=el('div',{class:'list scroll'});var rows=[];
    var upd=function(){var n=rows.filter(function(r){return r.cb.checked&&!r.cb.disabled}).length;info.textContent=n+' seleccionados · '+rows.length+' '+unit+' en total'};
    items.forEach(function(it){
      var cb=el('input',{type:'checkbox'});if(!it.ok)cb.disabled=true;
      var lead=it.color!==undefined?el('span',{class:'sw',style:'background:'+hexOk(it.color)}):el('span',{text:it.icon||'',style:'width:20px;text-align:center;flex:none'});
      var row=el('label',{class:'li'+(it.ok?'':' off'),title:it.ok?'':(it.why||'No se puede borrar'),style:it.indent?'padding-left:'+(12+it.indent*24)+'px':''},[cb,lead,el('span',{class:'grow',text:it.name+(it.ok?'':'  🔒')})]);
      cb.addEventListener('change',upd);
      rows.push({it:it,cb:cb,row:row,hay:nrm(it.name)});box.appendChild(row);
    });
    var flt=function(){var ws=nrm(find.value).split(/\s+/).filter(Boolean);rows.forEach(function(r){r.row.style.display=ws.every(function(w){return r.hay.indexOf(w)>=0})?'':'none'})};
    find.addEventListener('input',flt);
    upd();
    return {
      node:box,
      selected:function(){return rows.filter(function(r){return r.cb.checked&&!r.cb.disabled}).map(function(r){return r.it})},
      clear:function(){rows.forEach(function(r){r.cb.checked=false});upd()},
      markVisible:function(on){rows.forEach(function(r){if(!r.cb.disabled&&r.row.style.display!=='none')r.cb.checked=on});upd()}
    };
  }
  /* Borra uno por uno (así se ve el avance y no hay cortes por tiempo) */
  function bulkDelete(sel,unit,path,key,extra,out,done){
    var n=sel.length,i=0,okc=0,errs=[];
    out.hidden=false;out.textContent='';
    (function next(){
      if(i>=n||(errs.length>=5&&okc===0)){
        out.textContent=okc+' de '+n+' '+unit+' borrados.'+(errs.length?'\n\nNo se pudo:\n'+errs.join('\n'):'')+(i<n?'\n\nParé porque todos fallan; revisa el aviso de arriba.':'');
        toast('Borrados: '+okc+' de '+n+(errs.length?' · '+errs.length+' con error':''),errs.length>0&&okc===0);done(out.textContent);return;
      }
      var it=sel[i++];out.textContent='Borrando '+i+'/'+n+': '+it.name+'…';
      var b={};b[key]=it.id;for(var k in extra)b[k]=extra[k];
      mapi('POST',path,b).then(function(){okc++}).catch(function(e){if(/ya no existe/.test(e.message))okc++;else errs.push('• '+it.name+': '+e.message)}).then(next);
    })();
  }
  function listCard(b,title,hint,placeholder,items,unit,delPath,delKey,extraFn,afterDone){
    var find=el('input',{type:'text',placeholder:placeholder});
    var info=el('p',{class:'sub',style:'font-size:.85rem;margin:8px 0'});
    var out=el('pre',{hidden:'hidden'});
    var cl=checklist(items,find,info,unit);
    var del=el('button',{class:'btn bad',text:'🗑️ Borrar seleccionados'});
    del.addEventListener('click',function(){
      var sel=cl.selected();if(!sel.length)return toast('Marca primero lo que quieras borrar.',1);
      var names=sel.slice(0,12).map(function(x){return '• '+x.name}).join('\n')+(sel.length>12?'\n… y '+(sel.length-12)+' más':'');
      if(!confirm('¿Borrar '+sel.length+' '+unit+' de «'+G.name+'»?\n\n'+names+'\n\nEsto NO se puede deshacer.'))return;
      del.disabled=true;
      bulkDelete(sel,unit,delPath,delKey,extraFn?extraFn():{},out,function(txt){del.disabled=false;overview(true).then(function(){afterDone(txt)}).catch(function(e){toast(e.message,1)})});
    });
    b.appendChild(el('div',{class:'card'},[el('h3',{text:title}),el('p',{class:'sub',style:'font-size:.9rem',text:hint}),find,info,cl.node,
      el('div',{class:'row'},[del,el('button',{class:'btn sec',text:'Marcar los visibles',on:{click:function(){cl.markVisible(true)}}}),el('button',{class:'btn sec',text:'Desmarcar todo',on:{click:function(){cl.clear()}}})]),out]));
    return cl;
  }

  function tabRoles(b,prev){
    b.appendChild(el('p',{class:'sub',text:'Cargando roles…'}));
    overview(true).then(function(ov){
      b.innerHTML='';
      if(prev)b.appendChild(el('pre',{text:prev}));
      var items=ov.roles.map(function(r){return {id:r.id,name:r.name,color:r.color||'#99aab5',ok:r.deletable,why:r.why}});
      listCard(b,'🏷️ Roles ('+ov.roles.length+')','Marca los roles que quieras borrar. Los que llevan 🔒 no se pueden: pasa el ratón para ver por qué (suelen estar por encima del rol de Centinela). Al borrar un rol, todos los miembros lo pierden.','🔎 Buscar rol…',items,'roles','/role/delete','roleId',null,function(t){b.innerHTML='';tabRoles(b,t)});
    }).catch(function(e){b.innerHTML='';b.appendChild(el('p',{class:'err',text:e.message}))});
  }

  function tabChannels(b,prev){
    b.appendChild(el('p',{class:'sub',text:'Cargando canales…'}));
    overview(true).then(function(ov){
      b.innerHTML='';
      if(prev)b.appendChild(el('pre',{text:prev}));
      var ICON={text:'#',voice:'🔊',category:'📁',news:'📢',stage:'🎙️',forum:'💬'};
      var items=ov.channels.map(function(c){return {id:c.id,name:c.name,icon:ICON[c.kind]||'#',indent:c.parentId?1:0,ok:c.deletable,why:c.why,kind:c.kind}});
      var kids=el('input',{type:'checkbox'});
      b.appendChild(el('div',{class:'card'},[el('label',{class:'check'},[kids,el('span',{text:'Al borrar una categoría, borrar también los canales de dentro (si no, los canales se quedan sueltos)'})])]));
      var cl=listCard(b,(function(){var nc=ov.channels.filter(function(c){return c.kind==='category'}).length,nn=ov.channels.length-nc;return '📁 Canales ('+nn+(nn===1?' canal · ':' canales · ')+nc+(nc===1?' categoría)':' categorías)')})(),'Marca lo que quieras borrar. Primero se borran los canales y al final las categorías.','🔎 Buscar canal o categoría…',items,'canales','/channel/delete','channelId',function(){return {children:kids.checked}},function(t){b.innerHTML='';tabChannels(b,t)});
    }).catch(function(e){b.innerHTML='';b.appendChild(el('p',{class:'err',text:e.message}))});
  }

  function memberCard(mm,ov){
    var byId={};ov.roles.forEach(function(r){byId[r.id]=r});
    var chips=el('div',{style:'margin:6px 0'});
    var sel=el('select',{style:'max-width:280px'});
    var addBtn=el('button',{class:'btn sec mini',text:'➕ Dar rol'});
    var card=el('div',{class:'card'});
    function paint(){
      chips.innerHTML='';
      mm.roles.forEach(function(id){
        var r=byId[id];if(!r)return;
        var x=r.deletable?el('button',{title:'Quitar este rol',text:'×'}):null;
        if(x)x.addEventListener('click',function(){act('/role/remove',{userId:mm.id,roleId:id},function(res){mm.roles=res.roles;paint()},x)});
        chips.appendChild(el('span',{class:'chip',style:'border-left:4px solid '+hexOk(r.color)},[document.createTextNode(r.name+' '),x]));
      });
      if(!mm.roles.length)chips.appendChild(el('span',{class:'sub',style:'font-size:.85rem',text:'Sin roles'}));
      sel.innerHTML='';sel.appendChild(el('option',{value:'',text:'— elegir un rol para dar —'}));
      ov.roles.filter(function(r){return r.deletable&&mm.roles.indexOf(r.id)<0}).forEach(function(r){sel.appendChild(el('option',{value:r.id,text:r.name}))});
    }
    addBtn.addEventListener('click',function(){
      if(!sel.value)return toast('Elige primero el rol.',1);
      act('/role/give',{userId:mm.id,roleId:sel.value},function(res){mm.roles=res.roles;paint()},addBtn);
    });
    var kick=el('button',{class:'btn sec mini',text:'👢 Expulsar'});
    var ban=el('button',{class:'btn bad mini',text:'🔨 Banear'});
    if(!mm.canKick){kick.disabled=true;kick.title=mm.self?'No puedes expulsarte a ti':mm.owner?'Es el dueño del servidor':mm.me?'Soy yo':'Su rol está por encima del tuyo o del de Centinela'}
    if(!mm.canBan){ban.disabled=true;ban.title=mm.self?'No puedes banearte a ti':mm.owner?'Es el dueño del servidor':mm.me?'Soy yo':'Su rol está por encima del tuyo o del de Centinela'}
    kick.addEventListener('click',function(){
      var why=prompt('Expulsar a '+mm.name+' de «'+G.name+'».\nMotivo (opcional, queda en el registro de Discord):','');if(why===null)return;
      act('/kick',{userId:mm.id,reason:why},function(){card.remove()},kick);
    });
    ban.addEventListener('click',function(){
      var why=prompt('Banear a '+mm.name+' de «'+G.name+'».\nMotivo (opcional, queda en el registro de Discord):','');if(why===null)return;
      act('/ban',{userId:mm.id,reason:why},function(){card.remove()},ban);
    });
    var head=el('div',{class:'row',style:'flex-wrap:nowrap'},[
      mm.avatar?el('img',{class:'av',src:mm.avatar,alt:''}):el('span',{class:'av'}),
      el('div',{style:'flex:1;min-width:0;overflow-wrap:anywhere'},[el('strong',{style:'color:#f4f7fb',text:mm.name}),mm.bot?el('span',{class:'tag',text:'BOT'}):null,mm.owner?el('span',{class:'tag',text:'DUEÑO'}):null,el('div',{class:'sub',style:'font-size:.8rem;margin:0',text:mm.tag+' · '+mm.id})])]);
    card.appendChild(head);card.appendChild(chips);
    card.appendChild(el('div',{class:'row',style:'margin-top:8px'},[sel,addBtn,kick,ban]));
    paint();
    return card;
  }
  function tabMembers(b){
    var q=el('input',{type:'text',placeholder:'Nombre, apodo o ID del miembro…'});
    var go=el('button',{class:'btn',text:'Buscar'});
    var note=el('p',{class:'sub',style:'font-size:.88rem;margin:10px 0 0'});
    var res=el('div');
    b.appendChild(el('div',{class:'card'},[el('div',{class:'row'},[el('div',{style:'flex:1;min-width:220px'},[q]),go]),note]));
    b.appendChild(res);
    function search(){
      note.textContent='Buscando…';
      Promise.all([overview(false),mapi('GET','/members?q='+encodeURIComponent(q.value.trim()))]).then(function(r){
        note.textContent=r[1].note||(r[1].members.length+' resultado'+(r[1].members.length===1?'':'s'));
        res.innerHTML='';r[1].members.forEach(function(mm){res.appendChild(memberCard(mm,r[0]))});
      }).catch(function(e){note.textContent='';toast(e.message,1)});
    }
    go.addEventListener('click',search);
    q.addEventListener('keydown',function(e){if(e.key==='Enter')search()});
    search();
  }

  function tabBans(b){
    var idIn=el('input',{type:'text',placeholder:'ID del usuario a banear (aunque no esté en el servidor)'});
    var why=el('input',{type:'text',placeholder:'Motivo (opcional)',style:'margin-top:8px'});
    var days=el('select',{style:'margin-top:8px'});
    [['0','No borrar sus mensajes'],['1','Borrar sus mensajes del último día'],['7','Borrar sus mensajes de los últimos 7 días']].forEach(function(o){days.appendChild(el('option',{value:o[0],text:o[1]}))});
    var banBtn=el('button',{class:'btn bad',text:'🔨 Banear por ID',style:'margin-top:10px'});
    var q=el('input',{type:'text',placeholder:'🔎 Buscar baneado por nombre, ID o motivo…'});
    var info=el('p',{class:'sub',style:'font-size:.85rem;margin:8px 0'});
    var list=el('div',{class:'list scroll'});
    b.appendChild(el('div',{class:'card'},[el('h3',{text:'Banear por ID'}),idIn,why,days,banBtn]));
    b.appendChild(el('div',{class:'card'},[el('h3',{text:'Usuarios baneados'}),q,info,list]));
    function load(){
      info.textContent='Cargando…';
      mapi('GET','/bans?q='+encodeURIComponent(q.value.trim())).then(function(r){
        info.textContent=r.total+' baneados en total'+(r.truncated?' (Discord solo me deja ver los primeros 1000)':'')+(q.value.trim()?' · mostrando '+r.bans.length:'');
        list.innerHTML='';
        if(!r.bans.length)list.appendChild(el('div',{class:'li',style:'cursor:default'},[el('span',{class:'grow sub',text:'Nada que mostrar.'})]));
        r.bans.forEach(function(x){
          var un=el('button',{class:'btn sec mini',text:'✅ Desbanear'});
          un.addEventListener('click',function(){
            if(!confirm('¿Desbanear a '+x.tag+'?'))return;
            act('/unban',{userId:x.id},function(){load()},un);
          });
          list.appendChild(el('div',{class:'li',style:'cursor:default'},[el('div',{class:'grow'},[el('div',{style:'color:#f4f7fb',text:x.tag+(x.bot?'  🤖':'')}),el('div',{class:'sub',style:'font-size:.8rem;margin:0',text:x.id+(x.reason?' · '+x.reason:'')})]),un]));
        });
      }).catch(function(e){info.textContent='';list.innerHTML='';list.appendChild(el('div',{class:'li err',style:'cursor:default',text:e.message}))});
    }
    var t=null;q.addEventListener('input',function(){clearTimeout(t);t=setTimeout(load,350)});
    banBtn.addEventListener('click',function(){
      var id=idIn.value.trim();if(!/^\d{15,25}$/.test(id))return toast('Escribe un ID de usuario válido (solo números).',1);
      if(!confirm('¿Banear al usuario con ID '+id+' de «'+G.name+'»?'))return;
      act('/ban',{userId:id,reason:why.value,days:days.value},function(){idIn.value='';why.value='';load()},banBtn);
    });
    load();
  }

  function home(m){
    m.appendChild(el('h1',{text:G.name}));
    m.appendChild(el('p',{class:'sub',text:G.members+' miembros · '+G.mods.filter(function(x){return x.on}).length+' módulos activos'}));
    m.appendChild(el('button',{class:'card modcard',style:'width:100%;margin-bottom:16px;border-color:#3fd0b0',on:{click:function(){cur='tpl';nav();show('tpl')}}},[el('h3',{text:'🧩 Plantillas de servidor'}),el('p',{class:'sub',style:'margin:0;font-size:.9rem',text:'Elige un tipo de servidor (gaming, comunidad, ligas de fútbol, boxeo, NBA, F1…) y Centinela crea roles, canales, tickets, autoroles y bienvenidas por ti.'})]));
    m.appendChild(el('button',{class:'card modcard',style:'width:100%;margin-bottom:16px',on:{click:function(){cur='manage';nav();show('manage')}}},[el('h3',{text:'🛠️ Gestionar servidor'}),el('p',{class:'sub',style:'margin:0;font-size:.9rem',text:'Borra roles y canales, banea y desbanea, da y quita roles a tus miembros, todo desde la web.'})]));
    m.appendChild(el('h3',{text:'Personaliza cada cosa',style:'color:#f4f7fb;margin:6px 0 10px'}));
    var mg=el('div',{class:'grid'});
    G.mods.forEach(function(x){
      mg.appendChild(el('button',{class:'card modcard',on:{click:function(){cur=x.id;nav();show(x.id)}}},[
        el('h3',{text:x.ico+' '+x.n+(x.on===null?'':(x.on?'  · activo':'  · apagado'))}),el('p',{class:'sub',style:'margin:0;font-size:.88rem',text:x.d})]));
    });
    m.appendChild(mg);
    var c=el('div',{class:'card',style:'margin-top:22px'});c.appendChild(el('h3',{text:'Instalar módulos'}));
    c.appendChild(el('p',{class:'sub',text:'Marca lo que quieras activar. Se crean los canales y roles necesarios y se enciende cada función.'}));
    var boxes={};
    G.mods.filter(function(x){return x.installable}).forEach(function(x){
      var cb=el('input',{type:'checkbox',checked:'checked'});boxes[x.id]=cb;
      c.appendChild(el('label',{class:'check'},[cb,el('span',{text:x.ico+' '+x.n+' — '+x.d})]));
    });
    var out=el('pre',{hidden:'hidden'});
    c.appendChild(el('div',{class:'row',style:'margin-top:12px'},[el('button',{class:'btn',text:'Instalar seleccionados',on:{click:function(ev){
      ev.target.disabled=true;var ids=Object.keys(boxes).filter(function(k){return boxes[k].checked});
      api('POST','/api/guild/'+G.id+'/install',{ids:ids}).then(function(r){out.textContent=r.summary;out.hidden=false;load(G.id)}).catch(function(e){toast(e.message,1)}).then(function(){ev.target.disabled=false});
    }}})]));
    c.appendChild(out);m.appendChild(c);
  }
  function modView(m,mod){
    m.appendChild(el('h1',{text:mod.ico+' '+mod.n}));
    m.appendChild(el('p',{class:'sub',text:mod.d}));
    var card=el('div',{class:'card'});
    var onBox=null;
    if(mod.on!==null){onBox=el('input',{type:'checkbox'});onBox.checked=!!mod.on;card.appendChild(el('label',{class:'check'},[onBox,el('span',{text:'Módulo activado'})]))}
    var fin={},fil={},pin={};
    mod.fields.forEach(function(f){
      var inp;
      if(f.t==='choice'){inp=el('select');f.c.forEach(function(o){var op=el('option',{value:o,text:o});if(String(f.value)===o)op.selected=true;inp.appendChild(op)})}
      else if(f.long){inp=el('textarea');inp.value=f.value||''}
      else{inp=el('input',{type:f.t==='int'?'number':'text'});inp.value=f.value==null?'':f.value;if(f.t==='int'){inp.min=f.min;inp.max=f.max}}
      fin[f.k]=inp;card.appendChild(el('label',{text:f.l}));card.appendChild(inp);
    });
    if(mod.filters.length){card.appendChild(el('label',{text:'Filtros'}));mod.filters.forEach(function(f){var cb=el('input',{type:'checkbox'});cb.checked=f.value;fil[f.k]=cb;card.appendChild(el('label',{class:'check'},[cb,el('span',{text:f.n})]))})}
    mod.pickers.forEach(function(p){
      card.appendChild(el('label',{text:p.n+(p.shown&&p.shown!=='—'?'  (ahora: '+p.shown+')':'')}));
      if(p.type==='user'){var t=el('input',{type:'text',placeholder:'IDs separados por coma'});pin[p.key]=t;card.appendChild(t);return}
      var sel=el('select');if(p.multi)sel.multiple=true;
      var list=p.type==='role'?G.roles:G.channels;
      if(!p.multi)sel.appendChild(el('option',{value:'',text:'— sin cambios —'}));
      list.forEach(function(x){sel.appendChild(el('option',{value:x.id,text:(p.type==='role'?'@':'#')+x.name}))});
      pin[p.key]=sel;card.appendChild(sel);
    });
    var res=el('p',{class:'err'});
    card.appendChild(el('div',{class:'row',style:'margin-top:14px'},[el('button',{class:'btn',text:'Guardar',on:{click:function(){
      var body={fields:{},filters:{},pickers:{}};
      if(onBox)body.on=onBox.checked;
      Object.keys(fin).forEach(function(k){body.fields[k]=fin[k].value});
      Object.keys(fil).forEach(function(k){body.filters[k]=fil[k].checked});
      Object.keys(pin).forEach(function(k){var e=pin[k];var v=e.tagName==='SELECT'?[].filter.call(e.options,function(o){return o.selected&&o.value}).map(function(o){return o.value}):e.value.split(/[\s,]+/).filter(Boolean);if(v.length)body.pickers[k]=v});
      api('POST','/api/guild/'+G.id+'/mod/'+mod.id,body).then(function(r){
        res.textContent=r.errors.length?'No se pudo guardar: '+r.errors.join(', '):'';
        toast(r.errors.length?'Revisa los avisos':'Guardado',r.errors.length>0);load(G.id);
      }).catch(function(e){toast(e.message,1)});
    }}})].concat(mod.acts.map(function(a){return el('button',{class:'btn sec',text:a.n,on:{click:function(){
      api('POST','/api/guild/'+G.id+'/act/'+mod.id+'/'+a.key).then(function(r){toast(r.note);load(G.id)}).catch(function(e){toast(e.message,1)});
    }}})}))));
    card.appendChild(res);m.appendChild(card);
  }
  $('#back').addEventListener('click',function(e){e.preventDefault();api('GET','/api/guilds').then(pickerView)});
  loadGuilds();
})();
</script>
